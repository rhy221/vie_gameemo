# =============================================================================
# Vie-GameEmo: Multimodal Emotion Recognition for VN Game Livestreams
# Main configuration file
#
# Override any field via experiment configs in configs/experiments/*.yaml
# CLI args take precedence over both.
# =============================================================================

project:
  name: "vie-gameemo"
  version: "0.1.0"
  description: "Multimodal emotion recognition for Vietnamese game livestreams"

# -----------------------------------------------------------------------------
# Reproducibility & Logging
# -----------------------------------------------------------------------------
seed: 42

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"
  file: "outputs/logs/vie_gameemo.log"
  console: true

wandb:
  enabled: false  # set true if you want experiment tracking
  project: "vie-gameemo"
  entity: null  # your wandb username or team
  tags: []

# -----------------------------------------------------------------------------
# Paths (all relative to project root unless absolute)
# -----------------------------------------------------------------------------
paths:
  data_root: "data"
  raw_videos: "data/raw_videos"           # subfolders: train/ val/ test/
  labels: "data/labels"                   # train.json, val.json, test.json (input)
  processed: "data/processed"             # auto-generated by pipeline
  audios: "data/processed/audios"
  frames: "data/processed/frames"
  faces: "data/processed/faces"
  contexts: "data/processed/contexts"
  transcripts: "data/processed/transcripts"
  annotations: "data/annotations"         # auto-generated from labels/ by importer
  split_manifest: "data/splits.json"      # auto-generated: {clip_id: split_name}
  features: "data/features"
  cache: "data/cache"

  outputs: "outputs"
  checkpoints: "outputs/checkpoints"
  results: "outputs/results"
  # Per context_encoder branch checkpoints (set after retraining each branch)
  checkpoint_vit_imagenet: null   # e.g. "outputs/checkpoints/perception_vit_imagenet_best.pt"
  checkpoint_pose: null           # e.g. "outputs/checkpoints/perception_pose_best.pt"

# -----------------------------------------------------------------------------
# STAGE 0: Data Curation & Annotation
# Runs INDEPENDENTLY from training pipeline.
# Heavy compute (annotation needs large LLMs).
# -----------------------------------------------------------------------------
data:
  # Dataset scaling targets
  dataset_size:
    target_total: 600       # clips after annotation
    pilot: 50               # for initial verification
    min_viable: 300         # if compute is constrained

  # Genre distribution (sums to 1.0)
  genre_distribution:
    moba: 0.25              # LMHT, Lien Quan
    fps: 0.25               # Valorant, CSGO, PUBG
    horror: 0.15            # Resident Evil, Phasmophobia
    casual: 0.15            # Stumble Guys, Among Us
    rpg: 0.10               # Genshin, Persona
    mobile: 0.10

  # Clip splitting — annotation units are ~5s fixed segments
  clip:
    duration_seconds: 5     # target segment length (fixed 5s)
    min_seconds: 4.5        # accept tail segments down to 4.5s
    max_seconds: 5.5        # discard anything longer (shouldn't happen)

  # Train/val/test split (iterative multilabel stratification)
  split:
    method: "iterative_multilabel"   # iterative_multilabel | random
    stratify_on: ["emotion", "source_language", "genre", "codeswitch_bucket"]
    rare_class_cv: true              # k-fold CV for disgusted/fear/shocked
    train: 0.70
    val: 0.15
    test_in_distribution: 0.10
    test_out_of_distribution: 0.05   # streamers not in train

# Crawling (yt-dlp)
crawl:
  video_format: "best[height<=720]"   # 720p enough for face
  audio_format: "bestaudio"
  source_list: "data/source_urls.txt"  # one URL per line
  rate_limit_kbps: 2000                # be polite
  retry_attempts: 3

# Preprocessing (ffmpeg + opencv)
preprocess:
  audio:
    sample_rate: 16000
    channels: 1            # mono
    format: "wav"
  frames:
    fps: 4                 # extract at 4fps for 5s clips → 20 frames (enough to sample 16)
    format: "jpg"
    quality: 90

  # Optional: separate background music from speaker
  demucs:
    enabled: false         # only if EDA shows music too loud
    model: "htdemucs"

# Multi-agent annotation pipeline (Section 2.3 of spec)
annotation:
  enabled: true

  # OpenFace AU extraction
  openface:
    binary_path: "OpenFace_2.2.0/build/bin/FeatureExtraction"
    output_format: "csv"

  # Peak frame detection
  peak_frame:
    method: "max_au_intensity"   # alternatives: middle, attention_pool
    target_aus: [1, 2, 4, 6, 12, 25]  # emotion-relevant AUs

  # Agent: Visual description — Qwen2.5-VL (webcam region)
  qwen_vl:
    model_name: "Qwen/Qwen2.5-VL-32B-Instruct"
    quantization: "4bit"        # "4bit" | "8bit" | "none"
    max_new_tokens: 200
    temperature: 0.3
    prompt: |
      Đây là ảnh webcam của streamer trong lúc livestream game.
      Mô tả ngắn gọn (3-4 câu) bằng tiếng Việt:
      - Biểu cảm khuôn mặt (cười, nhăn mặt, mở miệng, nhắm mắt, ...)
      - Cử chỉ, hành động (giơ tay, đập bàn, che mặt, gật đầu, nhảy, ...)
      - Tư thế, hướng nhìn (cúi xuống, ngửa ra sau, nhìn camera, ...)
      Không suy luận cảm xúc, chỉ mô tả khách quan những gì nhìn thấy.

  # Agent: Audio prosody (Catd) — Qwen2-Audio
  qwen_audio:
    model_name: "Qwen/Qwen2-Audio-7B-Instruct"
    quantization: "4bit"
    max_new_tokens: 200
    prompt: |
      Phân tích đặc điểm âm thanh trong clip này bằng tiếng Việt:
      - Tốc độ nói (chậm/trung bình/nhanh)
      - Cao độ giọng (trầm/trung/cao)
      - Năng lượng (yếu/trung/mạnh)
      - Có tiếng la, cười, im lặng không?

  # ASR for transcript — chọn backend tại annotation.asr.backend
  asr:
    backend: "whisper"          # "whisper" | "phowhisper"
    # auto: per-clip Whisper LID, but restricted to whisper.vi/whisper.en
    # (see WhisperASR.transcribe) since clips are short (~5s) and Whisper's
    # full ~99-language open-set LID can confidently misdetect background
    # game music/SFX as e.g. ko/zh. | metadata: force ann.source_language.
    # | force: always force_language below.
    language_routing: "auto"
    force_language: "vi"
    detect_for_validation: true   # always run detect for audit, NOT to override
    # Redo pinned to a concrete language if the pick's own confidence is
    # below this, even when it already landed in {vi, en} — low confidence
    # signals ambiguous/near-silent/noisy audio where forcing a language +
    # initial_prompt curbs hallucination.
    lang_prob_threshold: 0.6

    # fastText lid.176 cross-check on transcript output
    text_lid:
      backend: "fasttext"         # lid.176 (offline, <1MB)
      model: "lid.176.ftz"

    # faster-whisper backend (openai/whisper-* models)
    whisper:
      model_name: "openai/whisper-large-v3"
      compute_type: "int8_float16"
      vad_filter: true
      no_speech_threshold: 0.6
      beam_size: 5
      condition_on_previous_text: false
      log_prob_threshold: -0.5
      hallucination_silence_threshold: 2.0
      vi:
        language: "vi"
        initial_prompt: "Đây là livestream game của streamer Việt Nam. Streamer hay nói: GG, clutch, ace, headshot, MVP, noob, lag, buff, nerf, rank, bot, carry, feed, gank, roam, farm, push, die, kill, team, ơi trời, vãi, thôi rồi, ăn rồi, xong rồi, đi nào, vào nào, địt mẹ, đéo, đụ má, cái lồn, vãi lồn, chó, ngu, đồ ngu, cứt, mẹ mày, bố mày, wtf, shit."
        post_process: "bartpho"
      en:
        language: "en"
        initial_prompt: "This is a game livestream. The streamer often says: GG, clutch, ace, headshot, MVP, noob, lag, buff, nerf, rank, bot, carry, feed, gank, roam, farm, push, die, kill, team, let's go, oh my god, no way, come on, what the fuck, shit, damn, fuck, bro, dude."
        post_process: "none"

    # HuggingFace transformers pipeline (VinAI PhoWhisper — fine-tuned on Vietnamese)
    phowhisper:
      model_name: "vinai/PhoWhisper-large"
      compute_type: "float16"
      chunk_length_s: 30
      batch_size: 8
      vi:
        language: "vi"
        post_process: "bartpho"
      # no "en" key — EN clips fallback to whisper

    # Optional BARTpho post-processing (disabled by default)
    bartpho:
      enabled: false
      model_name: "vinai/bartpho-syllable-1_5"
      max_length: 256
      num_beams: 4
      prefix: "Sửa lỗi chính tả và hoàn thiện câu: "

  # Consolidator — merges all signals into final reasoning
  consolidator:
    model_name: "Qwen/Qwen2.5-32B-Instruct"
    quantization: "4bit"
    max_new_tokens: 400
    temperature: 0.5
    output_format: "structured"   # <think>...</think><answer>...</answer>

  # Batching & memory management
  batch_size: 16            # clips per phase
  memory_strategy: "serial"  # load → process → unload each agent

# Labeling schemas (try both in ablation)
labeling:
  primary_schema: "gaming_8"   # "ekman_7" or "gaming_8"
  schemas:
    ekman_7:
      labels: ["vui", "buon", "tuc_gian", "so_hai", "ngac_nhien", "ghe_tom", "trung_tinh"]
    gaming_8:
      # Order is canonical; class indices follow this order (0..7).
      # See docs/annotation_guideline.md for definitions and decision rules.
      labels: ["neutral", "hype", "amused", "tilted", "sad", "shocked", "fear", "disgusted"]

  # Target per-class share of the dataset (sums to 1.0).
  # Tiered by livestream prevalence: common > medium > rare.
  # 600 clips → 120 / 90 / 78 / 78 / 66 / 72 / 54 / 42
  class_distribution:
    neutral:   0.20    # common: baseline/idle/explaining/silent tryhard
    hype:      0.15    # common: clutch, ace, win
    amused:    0.13    # common: laugh, funny moment
    tilted:    0.13    # medium: frustration, anger
    sad:       0.11    # medium: loss, regret
    shocked:   0.12    # medium: surprise, jump scare reaction
    fear:      0.09    # rare:   horror games, panic
    disgusted: 0.07    # rare:   gore, bad teammate, cringe

  # Annotation reliability
  min_cohens_kappa: 0.6
  num_annotators: 2

# -----------------------------------------------------------------------------
# STAGE 1: Demuxing (audio + frames extraction)
# Light compute, runs alongside Stage 0
# -----------------------------------------------------------------------------
# (Settings already covered in preprocess block above)

# -----------------------------------------------------------------------------
# STAGE 2a: Audio Encoder
# -----------------------------------------------------------------------------
audio_encoder:
  type: "whisper"   # "whisper" | "ast" | "wav2vec2" | "hubert" (for ablation)
  target_tokens: 64        # adaptive pool to this length
  # d_out: leave unset (null) so the encoder outputs its native hidden size.
  # Dimension standardization to fusion.d_model happens in the fusion model's
  # own trainable per-modality MLP (see fusion.audio_dim below), not here —
  # a projection added inside this frozen encoder would never be trained.
  d_out: null
  # One checkpoint per type, keyed by `type` above. Ablating across types is
  # then just flipping `type` — no risk of leaving a stale checkpoint from a
  # previous type in place (as would happen with a single flat model_name).
  models:
    whisper: "openai/whisper-small"                       # 768d
    ast: "MIT/ast-finetuned-audioset-10-10-0.4593"          # 768d
    wav2vec2: "facebook/wav2vec2-base"                      # 768d
    hubert: "facebook/hubert-base-ls960"                    # 768d

# -----------------------------------------------------------------------------
# STAGE 2b: Visual Dual-Path Encoder (Section 5 of spec — DOMAIN ADAPTED)
# -----------------------------------------------------------------------------
visual_encoder:
  strategy: "dual_path"   # "full_frame" | "face_only" | "dual_path" (recommended)

  # Webcam region detection (separates streamer face from in-game NPC faces)
  webcam_detector:
    backend: "yolo"             # "mediapipe" | "owlv2" | "yolo"
    min_detection_confidence: 0.1
    sample_n_frames: 30          # frames sampled to find stable region
    clustering:
      method: "dbscan"
      eps: 0.08
      min_samples: 3
    stability_threshold: 0.3     # cluster_size / sample_n (lowered for small webcams)
    edge_bias: 0.3               # webcam usually within 0.3 of edges
    fallback: "full_frame"       # full_frame = context encoder uses full frames when no webcam

    # OWLv2 settings (zero-shot, no training needed)
    owlv2:
      model: "google/owlv2-base-patch16-finetuned"
      prompt: "facecam overlay"

    # YOLO settings (requires trained weights or COCO pretrained)
    yolo:
      model: "yolo11n.pt"        # path to weights or ultralytics model ID
      classes: [0]               

  # Path 1: face encoder (streamer face only)
  face_encoder:
    model_name: "trpakov/vit-face-expression"   # ViT-FER, pretrain AffectNet
    crop_margin: 0.2             # 20% expand around detected face
    target_size: [224, 224]
    dual_view:
      global:
        source: "middle_frame"   # heuristic: peak emotion often mid-clip
      temporal:
        n_frames: 16             # sweet spot per spec ablation
        spatial_pool: [2, 2]     # 2x2 → 64 tokens/frame
        pool_method: "attention" # "mean" | "max" | "attention" | "video_native"

  # Path 2: context encoder (webcam region — body language, posture, background)
  # Set type to "pose" to switch to pose-kinematics branch; keep "vit_imagenet" for ablation.
  context_encoder:
    type: "vit_imagenet"          # "vit_imagenet" | "pose"

    # --- vit_imagenet branch (baseline/ablation) ---
    backend: "vit"                # "vit" (default) | "eva_vit_b" (EVA ViT-B, needs `timm` installed)
    model_name: "google/vit-base-patch16-224"   # ImageNet pretrain (used when backend="vit" and
                                                 # `models.<backend>` below is unset)
    # Per-backend checkpoint, keyed by `backend` above — flipping `backend` alone
    # is then enough to ablate vit vs eva_vit_b (mirrors audio_encoder.models).
    # Both output 768-d embeddings, same as d_model below, so no fusion changes
    # are needed to swap between them; fusion.context_dim auto-infers from the
    # cached feature shapes either way (see fusion.modality_dim_kwargs).
    models:
      vit: "google/vit-base-patch16-224"
      eva_vit_b: "timm/eva02_base_patch14_224.mim_in22k"   # EVA02-Base, 768d, 224x224 (MIM pretrain, no classifier — used as feature backbone same as vit)
    n_frames: 16
    target_size: [224, 224]
    # Emotion-LLaMA-v2-inspired richer context representation (see its
    # spatiotemporal-downsampled "video" stream): keep more of the 16 sampled
    # frames instead of collapsing to a single mean-pooled token. Both knobs
    # are independent and OFF-like-before by default combination is
    # ("mean", false); set them back to that pair to revert to the original
    # single-token-per-clip behavior if this doesn't help.
    temporal_pool: "mean"           # "mean" (revert: 1 token/clip) | "none" (keep 16 steps)
    use_patch_tokens: false          # true: keep pooled patch tokens (spatial layout, "vit" backend
                                     # only) | false (revert): CLS-only, matches previous behavior
    spatial_pool: [2, 2]            # patch grid pooled to this size per frame when use_patch_tokens
                                     # (2x2x16=64 tokens/clip with temporal_pool="none", matching
                                     # Emotion-LLaMA-v2's 64-token video-stream budget)

    # --- pose branch (new) ---
    pose_backend: "mediapipe"     # "mediapipe" | "mmpose"
    pose_keypoints: "upper_body"  # upper_body + hands + head landmarks only
    # TODO (P0.3): calibrate n_frames_pose independently — pose may benefit from
    # denser sampling (e.g. 32) to catch sub-second impulse events like desk-slaps.
    n_frames_pose: 16             # separate from ViT n_frames (P0.0-fix.6)
    pose_confidence_as_feature: true   # keep low-confidence keypoints as signal (P0.2)
    pose_temporal:
      type: "bigru"
      hidden_dim: 128             # BiGRU hidden_size; output dim = hidden_dim*2 → Linear → 768
      n_layers: 1
      dropout: 0.3

# -----------------------------------------------------------------------------
# STAGE 2c: Text Encoder
# -----------------------------------------------------------------------------
text_encoder:
  backend: "cafebert"   # cafebert (default) | xlmr-large | xlmr-base | xlm-emo | mE5-frozen | phobert
  model: "uitnlp/CafeBERT"
  warm_start: "none"     # "MilaNLProc/xlm-emo-t" to test emotion-pretrain transfer
  freeze: true          # true for mE5-frozen baseline (cheap compute)
  max_length: 128
  pooling: "cls"         # "cls" | "mean"

  # Language-adversarial head (TASK 2.7)
  language_adversarial:
    enabled: false       # enable based on ablation decision
    lambda_grl: 0.1

  # Per-backend model overrides (used by factory)
  cafebert:
    model_name: "uitnlp/CafeBERT"
  xlmr_large:
    model_name: "FacebookAI/xlm-roberta-large"
  xlmr_base:
    model_name: "FacebookAI/xlm-roberta-base"
  xlm_emo:
    model_name: "MilaNLProc/xlm-emo-t"
  mE5_frozen:
    model_name: "intfloat/multilingual-e5-large"
  phobert:
    model_name: "vinai/phobert-base-v2"

# -----------------------------------------------------------------------------
# STAGE 3: Conv-Attention 4-Modality Fusion
# -----------------------------------------------------------------------------
fusion:
  type: "conv_attention_4m"   # "late" | "early" | "mult" | "q_former" | "conv_only" | "attn_only" | "conv_attention_4m"

  d_model: 768                 # shared fused channel dim after per-modality MLPs
  n_modalities: 4              # audio + face + context + text
  # Raw text-encoder output dim before standardization. Leave unset (null) to
  # auto-infer from the cached feature shapes in paths.features (see
  # modality_dim_kwargs) — this tracks text_encoder.backend automatically, so
  # switching cafebert/xlmr_large (1024d) vs xlmr_base/xlm_emo/phobert (768d)
  # doesn't require hand-syncing this value (that hand-sync was the cause of
  # a "mat1 and mat2 shapes cannot be multiplied" crash when switching to a
  # 768-dim backend while this was still hardcoded to 1024). Set explicitly
  # only to override auto-detection.
  text_dim: null
  # Raw audio-encoder output dim before standardization. Leave unset (null)
  # to auto-infer from the cached feature shapes in paths.features (see
  # modality_dim_kwargs) — this tracks audio_encoder.type/model_name
  # automatically so switching between whisper/ast/wav2vec2/hubert (or
  # Whisper sizes) doesn't require hand-syncing this value. Set explicitly
  # only to override auto-detection.
  audio_dim: null
  # Ablation switch: if true, a modality whose raw dim already equals d_model
  # (e.g. context_dim=768 for both vit and eva_vit_b backends) gets nn.Identity()
  # instead of a trainable nn.Linear(d_model, d_model) standardizer. Default
  # false = original behavior (every modality always gets a Linear, which also
  # acts as a learned per-modality adapter even when dims already match).
  # Changes the fusion state_dict shape for matched modalities — a checkpoint
  # trained with one setting will NOT load under the other.
  skip_mlp_if_matched: true
  n_conv_blocks: 4
  kernel_size: 3
  activation: "switch"         # x * sigmoid(x), Swish-like
  attn_hidden_div: 2           # hidden dim = d_model * n_modalities / 2

  # Embedding-space augmentation (Gaussian noise + SpecAugment-style time
  # masking), applied per-modality before fusion. Stand-in for raw pixel/audio
  # augmentation, which isn't possible here since Stage 1 trains on frozen
  # pre-extracted embeddings (see training/losses.py::embedding_augment).
  # New — default off (enabled: false) so it's a pure opt-in; set true to try it.
  embedding_augment:
    enabled: true
    noise_std: 0.05             # Gaussian noise std, relative to each sample's own embedding std
    time_mask_p: 0.2            # per-sample probability of masking one contiguous time span
    max_mask_frac: 0.2          # that span covers up to 20% of the sequence length

  # Randomly zero one whole modality per training sample each step (forces the
  # model not to over-rely on any single modality always being present).
  # Was previously defined but NOT wired into perception.py (silently inert);
  # now actually applied there. Set enabled: false to revert to no augmentation.
  modality_dropout:
    enabled: true
    p: 0.3                     # 30% chance per sample to zero one random modality

  # Align sequence lengths to this target before fusion
  align_to: "audio"            # all modality seqs aligned to audio (64 tokens)

  # Return attention weights for interpretability
  return_attention: true

# -----------------------------------------------------------------------------
# STAGE 4: Emotion Classifier
# -----------------------------------------------------------------------------
classifier:
  type: "mlp"
  hidden_dim: 256
  dropout: 0.3
  activation: "gelu"
  n_classes: 8                 # match labeling.primary_schema (gaming_8)
  pool: "max"            # "mean" | "max" | "cls" | "attention" (pool over T tokens of u_fusion)

  loss:
    type: "weighted_ce"              # "ce" | "weighted_ce" | "focal"
    focal:
      alpha: 1.0               # overridden by class_weights when not "none"
      gamma: 2.5               # 2.5 for imbalance ratio ~12.5:1 (neutral/disgusted)
    class_weights: "effective_number"   # "inverse_freq" | "effective_number" | "none"
  sampler: "balanced_batch"         # "balanced_batch" | "none"
  augment:
    # Manifold Mixup at the fused-embedding level (mixes pairs of samples'
    # u_fusion before the classifier). Was previously defined but NOT wired
    # into perception.py (silently inert); now actually applied there. Set
    # fused_mixup: false to revert to no mixup (previous behavior).
    fused_mixup: false
    mixup_alpha: 0.4               # Beta(alpha,alpha) mixing ratio; higher = more mixing
    # Class indices to bias mixing pairs toward (at least one sample per pair
    # is drawn from these classes when possible) — targets the smallest-support
    # classes specifically (disgusted=16, shocked=32 samples in test split).
    # Indices match EmotionLabel order: shocked=5, disgusted=7.
    rare_classes: [5, 7]

  # 2-stage hierarchical classifier: Stage A picks easy-vs-hard group, Stage B
  # has one small head per group. Derived from test-set confusion analysis:
  # {shocked,fear,tilted,disgusted} form a mutually-confusable "hard" cluster
  # (F1 0.62-0.76), distinct from {neutral,hype,amused,sad} ("easy", F1
  # 0.87-0.94). Set enabled: false to revert to the flat single-head
  # classifier (previous behavior) if this doesn't help.
  hierarchical:
    enabled: false                 # true: 2-stage easy/hard classifier | false (revert): flat head
    # Indices match EmotionLabel declaration order (schemas.py): neutral=0,
    # hype=1, amused=2, tilted=3, sad=4, shocked=5, fear=6, disgusted=7.
    # Must partition range(n_classes) exactly (every index in one group).
    easy_idx: [0, 1, 2, 4]          # neutral, hype, amused, sad
    hard_idx: [3, 5, 6, 7]          # tilted, shocked, fear, disgusted

# -----------------------------------------------------------------------------
# STAGE 5: LLM Reasoner — 4 setups to compare
# -----------------------------------------------------------------------------
llm:
  # Active setup for current run
  active_setup: "llm1"   # "llm1" | "llm2" | "llm3" | "llm4"

  # Path to cognition checkpoint (for ModalAdapter in LLM-1/2/3).
  # Set after running: python scripts/train.py --stage cognition
  # LLM-1 uses it optionally (soft token), LLM-2/3 require it.
  cognition_checkpoint: null   # e.g. "outputs/checkpoints/cognition_best.pt"

  # Shared base model
  base_model:
    name: "Qwen/Qwen2.5-32B-Instruct"
    fallback: "Qwen/Qwen2.5-7B-Instruct"
    quantization: "4bit"
    device_map: "auto"
    max_new_tokens: 300
    temperature: 0.7

  # Setup 1: Explainer (trained or zero-shot)
  # Input: soft token + MLP penult + label → explains WHY (never overrides label)
  # If no checkpoint: falls back to zero-shot text-only prompt
  llm1:
    explanation_checkpoint: null  # e.g. "outputs/checkpoints/llm1_explanation_best.pt"

  # Setup 2: Co-Reasoner (requires cognition training)
  # Input: soft token + MLP label (hint) → own prediction (may override)
  llm2: {}

  # Setup 3: Pure Reasoner (requires cognition training)
  # Input: soft token only → prediction + reasoning (no MLP label at all)
  llm3: {}

  # Setup 4: RLVR-trained (R1-Omni-inspired)
  llm4:
    cold_start:
      n_samples: 100             # samples from multi-agent reasoning for SFT init
      epochs: 2
      learning_rate: 5e-5

    rlvr:
      algorithm: "grpo"          # Group Relative Policy Optimization
      num_generations: 4         # G in GRPO
      learning_rate: 1e-5
      beta: 0.04                 # KL coefficient
      num_epochs: 2
      batch_size: 2
      gradient_accumulation: 8
      max_prompt_length: 512
      max_completion_length: 512
      use_vllm: true

      reward:
        accuracy_weight: 1.0
        format_weight: 1.0
        format_pattern: '<think>.*</think>.*<answer>.*</answer>'

# -----------------------------------------------------------------------------
# Training: Perception-to-Cognition Curriculum (Section 10 of spec)
# -----------------------------------------------------------------------------
training:
  # Stage 1: Perception (classification only)
  perception:
    epochs: 30
    batch_size: 16
    gradient_accumulation: 4    # effective batch = 64
    learning_rate:
      fusion: 2.0e-4
      classifier: 2.0e-4
      encoders: 0.0             # frozen
    weight_decay: 0.01
    optimizer: "adamw"
    scheduler: "cosine"
    warmup_ratio: 0.1
    grad_clip: 1.0
    mixed_precision: "bf16"     # "no" | "fp16" | "bf16"
    gradient_checkpointing: false

    early_stopping:
      enabled: true
      patience: 30
      monitor: "val_macro_f1"
      mode: "max"

  # Stage 2a: LLM Perception (align soft token → predict label)
  # Only needs GT labels, no annotated descriptions.
  llm_perception:
    epochs: 10
    batch_size: 4
    gradient_accumulation: 8
    learning_rate:
      fusion: 2.0e-5            # fine-tune fusion_v2 for LLM (dual-fusion)
      llm: 2.0e-5
      llm_adapter: 2.0e-4
    lora:
      enabled: true
      rank: 16
      alpha: 32
      target_modules: ["q_proj", "v_proj"]

  # Stage 2b: Cognition (joint classification + reasoning)
  cognition:
    epochs: 10
    batch_size: 4
    gradient_accumulation: 8
    learning_rate:
      llm: 2.0e-5
      llm_adapter: 2.0e-4
      fusion: 0.0               # frozen after Stage 1
      classifier: 0.0           # frozen after Stage 1
    loss_weights:
      classification: 1.0
      reasoning_lm: 0.5

    # LoRA for LLM fine-tune
    lora:
      enabled: true
      rank: 16
      alpha: 32
      target_modules: ["q_proj", "v_proj"]

  # Stage LLM-1 Explanation: faithful explainer (B1-B6 from claude_code_prompt)
  llm1_explanation:
    epochs_a: 15            # Stage A: alignment (ModalAdapter + g_head only)
    epochs_b: 10            # Stage B: LoRA fine-tune (optional)
    run_stage_b: false      # Set true to run Stage B after Stage A
    batch_size: 2
    gradient_accumulation: 16
    learning_rate:
      adapter: 2.0e-4
      g_head: 2.0e-4
      lora: 2.0e-5
    lora:
      rank: 4
      alpha: 8
      target_modules: ["q_proj", "v_proj"]
    loss:
      lambda_kl: 0.1        # KL distillation from MLP confidence (0 to disable)
      lambda_rec: 0.3        # g_head reconstruction loss (0 to disable)
      kl_temperature: 2.0
    g_head:
      hidden_dim: 128
      # n_attrs is dynamic per context_encoder.type:
      #   pose:        15 = face(5) + voice(3) + motion(3) + text(4)
      #   vit_imagenet: 12 = face(5) + voice(3) + text(4)  — no context head
      n_attrs_pose: 15
      n_attrs_vit_imagenet: 12
    early_stopping:
      patience: 5
      monitor: "val_agreement"

# -----------------------------------------------------------------------------
# Cue extraction thresholds (used by CueExtractor; can be overridden per experiment)
# -----------------------------------------------------------------------------
cues:
  # TODO (P0.3): calibrate these thresholds using percentiles from actual training data.
  # Current values are initial estimates — run scripts/calibrate_cue_bins.py after
  # precomputing pose kinematics on the full dataset.
  motion_energy_bins: [[0.02, "low"], [0.08, "moderate"]]   # upper-bound per label (last = high)
  impact_bins:        [[0.05, "none"], [0.15, "moderate"]]   # last = strong
  periodicity_bins:   [[0.20, "none"], [0.50, "weak"]]       # last = rhythmic
  impact_conf_threshold: 0.3   # min wrist confidence across 3-frame acc window to count as valid impact

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
evaluation:
  faithfulness:
    hedge_threshold: 0.6   # LLM emotion-token prob < threshold → considered "hedged"
    n_samples: 200
  metrics:
    - "accuracy"
    - "weighted_f1"
    - "macro_f1"
    - "uar"                # unweighted average recall
    - "per_class_f1"
    - "confusion_matrix"

  # Strategy A/B/C ablation
  strategy_ablation:
    enabled: true
    strategies:
      - "full_frame"       # A (paper baseline)
      - "face_only"        # B
      - "dual_path"        # C (recommended)

  # Per-genre breakdown
  per_genre: true

  # Human eval (LLM explanation quality)
  human_eval:
    n_samples: 50
    n_reviewers: 3
    likert_scale: 5

  # OOD generalization (R1-Omni style)
  ood:
    enabled: true
    method: "unseen_streamer"   # leave-one-streamer-out

  # Statistical significance
  n_seeds: 3
  paired_t_test: true

# -----------------------------------------------------------------------------
# Inference: Batch vs Real-time
# -----------------------------------------------------------------------------
inference:
  mode: "batch"   # "batch" | "realtime"

  batch:
    batch_size: 8
    include_llm_explanation: true

  realtime:
    sliding_window_seconds: 5
    step_seconds: 1
    max_latency_ms: 600
    skip_llm: true              # LLM async on user click
    use_compressed_models: true # MobileViT, Whisper-tiny, etc.

# -----------------------------------------------------------------------------
# Compute & Hardware
# -----------------------------------------------------------------------------
compute:
  device: "auto"   # "cuda" | "cpu" | "auto"
  num_workers: 4   # DataLoader workers
  pin_memory: true

  # Profile: "a100" (Section 14.1) or "colab" (Section 14.2)
  profile: "colab"  # affects model size choices in llm.base_model

  # Memory limits for annotation pipeline
  annotation_vram_gb: 15  # T4 = 16, leave 1GB headroom

# -----------------------------------------------------------------------------
# Feature Caching (precompute frozen encoder outputs)
# -----------------------------------------------------------------------------
feature_cache:
  enabled: true
  format: "pt"   # torch.save
  recompute_if_config_changed: true
  store_attention_weights: false   # set true for interpretability runs

# -----------------------------------------------------------------------------
# Raw-level augmentation (before encoding — color/crop jitter for face+context
# images, pitch-shift/time-stretch/noise/SpecAugment for audio). Distinct from
# fusion.embedding_augment / classifier.augment (which perturb the already-
# encoded feature). See src/vie_gameemo/augment/.
# -----------------------------------------------------------------------------
augment:
  raw:
    # "none" (default/revert): no raw augmentation, exactly current behavior.
    # "precomputed": extract_features.py --augment-copies K caches K extra
    #   randomly-augmented variants per clip; VieGameEmoDataset randomly picks
    #   among all cached variants each time a train sample is loaded. Fast
    #   (no extra cost at train time) but limited to K fixed variants.
    # "online": re-derive raw crops/waveform + augment + re-encode through the
    #   (loaded, frozen) encoders every training step — genuinely fresh
    #   augmentation each time, but much slower (a full encoder forward pass
    #   per augmented sample per step instead of a free cached-tensor read)
    #   and loads extra encoder(s) into the training process.
    mode: "none"
    # Only used when mode="precomputed": max number of {clip_id}_aug{i}.pt
    # variants VieGameEmoDataset looks for per clip (must be >= whatever
    # --augment-copies K was passed to extract_features.py; missing files are
    # skipped, not an error).
    precomputed_copies: 5

    # Omit `image` or `audio` entirely to skip augmenting that modality group
    # (e.g. only set `audio` to augment audio but leave face/context untouched).
    image:
      color_jitter:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.05
      crop_scale_range: [0.85, 1.0]   # random-crop keeps this fraction of area, then resizes back
      horizontal_flip_p: 0.0          # off by default

    audio:
      pitch_shift_semitones: [-2.0, 2.0]
      time_stretch_rate: [0.9, 1.1]
      noise_std: [0.0, 0.01]
      spec_augment:
        time_mask_p: 0.2
        freq_mask_p: 0.2
